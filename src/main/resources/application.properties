spring.application.name=workshop

server.port=8080

jwt.secret-key="iIdEFo+WY5TuYwi/w01ikV0SxvPLpKTxQSjLuJ4JsLc="
jwt.expire-time=15m

# Database Connection Properties
spring.datasource.main.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=workshop
spring.datasource.main.username=postgres
spring.datasource.main.password=12345

# Optional: Hibernate DDL-Auto and SQL logging properties
# "update" will update the schema based on your entities
spring.jpa.hibernate.ddl-auto=update
# Shows the SQL queries generated by hibernate in the console
spring.jpa.show-sql=true
# Disable the startup Datasource initializer
spring.datasource.initialization-mode=never
spring.sql.init.mode=never

# Optional: specify the driver class name (usually not needed for recent Spring Boot versions)
spring.datasource.main.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false